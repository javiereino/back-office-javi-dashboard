<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Back Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" crossorigin src="/back-office-javi-dashboard/assets/index-CWO0F7En.js"></script>
    <link rel="stylesheet" crossorigin href="/back-office-javi-dashboard/assets/index-BhbjzpzF.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The dashboard bundle is prebuilt, so the link to the per diem calculator is added to its sidebar here.
      (function () {
        function add() {
          var nav = document.querySelector('.main-nav');
          if (!nav || nav.querySelector('[data-per-diem]')) return;
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('data-per-diem', '');
          b.setAttribute('role', 'link');
          b.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M8 6h8"/><path d="M8 11h.01"/><path d="M12 11h.01"/><path d="M16 11h.01"/><path d="M8 15h.01"/><path d="M12 15h.01"/><path d="M16 15h.01"/><path d="M8 19h8"/></svg><span>Per diem</span>';
          b.addEventListener('click', function () { window.location.href = '/back-office-javi-dashboard/per-diem/'; });
          nav.appendChild(b);
        }
        new MutationObserver(add).observe(document.getElementById('root'), { childList: true, subtree: true });
        add();
      })();
    </script>
  </body>
</html>
