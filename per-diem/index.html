  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a2351;color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:16px}

<body>
  <p>La calculadora de dietas se ha trasladado a<br><a href="https://javiereino.github.io/interpol-per-diem/">javiereino.github.io/interpol-per-diem</a></p>
  <script>
    // The calculator used to live here as an installable offline app: remove its old service worker, then move on.
    (function () {
      var go = function () { location.replace('https://javiereino.github.io/interpol-per-diem/'); };
      if (!('serviceWorker' in navigator)) return go();
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return r.scope.indexOf('/back-office-javi-dashboard/per-diem/') >= 0; }).map(function (r) { return r.unregister(); }));
      }).then(go, go);
    })();
  </script>
